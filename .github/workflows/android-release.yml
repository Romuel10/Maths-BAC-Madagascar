name: Validation et Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: maths-bac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation complète
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les vulnérabilités npm
        run: npm audit --audit-level=low

      - name: Vérifier les scripts shell
        run: bash -n scripts/*.sh

      - name: Tester le projet complet
        run: npm run test:full

  android-check:
    name: Vérification Android
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Installer les dépendances
        run: npm ci

      - name: Synchroniser Capacitor
        run: npm run cap:sync

      - name: Compiler Android, les tests et la release
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleAndroidTest :app:bundleRelease

  build-aab:
    name: Bundle Android signé
    needs:
      - validate
      - android-check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.MATHS_BAC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MATHS_BAC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATHS_BAC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATHS_BAC_KEY_PASSWORD }}
        run: bash ./scripts/prepare-android-signing.sh

      - name: Construire le bundle signé
        run: npm run android:bundle

      - name: Publier l’artefact AAB
        uses: actions/upload-artifact@v7
        with:
          name: maths-bac-madagascar-v1.0.1-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
