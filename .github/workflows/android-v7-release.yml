name: Validation et Android V7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: maths-bac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    name: Mise à jour temporaire du package-lock
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/prepublication-audit-2026-10-01'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Régénérer le verrouillage
        run: npm install --package-lock-only --ignore-scripts

      - name: Enregistrer le package-lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock déjà à jour"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh Vite 8 npm lockfile"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    needs: refresh-lock
    name: Validation complète
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les vulnérabilités npm
        run: npm audit --audit-level=low

      - name: Tester le projet complet
        run: npm run test:full

  android-check:
    name: Vérification Android
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Installer les dépendances
        run: npm ci

      - name: Synchroniser Capacitor
        run: npm run cap:sync

      - name: Compiler Android, les tests et la release
        working-directory: android
        run: bash ./gradlew testDebugUnitTest assembleDebug assembleAndroidTest bundleRelease

  build-aab:
    name: Bundle Android signé
    needs:
      - validate
      - android-check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.MATHS_BAC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MATHS_BAC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATHS_BAC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATHS_BAC_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Secret MATHS_BAC_KEYSTORE_BASE64 manquant'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Secret MATHS_BAC_KEYSTORE_PASSWORD manquant'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Secret MATHS_BAC_KEY_ALIAS manquant'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Secret MATHS_BAC_KEY_PASSWORD manquant'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maths-bac-release.jks"
          echo "MATHS_BAC_KEYSTORE_PATH=$RUNNER_TEMP/maths-bac-release.jks" >> "$GITHUB_ENV"
          echo "MATHS_BAC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MATHS_BAC_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MATHS_BAC_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Construire le bundle signé
        run: npm run android:bundle

      - name: Publier l’artefact AAB
        uses: actions/upload-artifact@v7
        with:
          name: maths-bac-madagascar-v7-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
